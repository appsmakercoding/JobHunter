name: Build Job Hunter APK

# মেইন বা মাস্টার ব্রাঞ্চে কোড পুশ করলেই অটোমেটিক APK তৈরি হবে
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Copy PDF / YAML libraries
        run: |
          cp node_modules/html2pdf.js/dist/html2pdf.bundle.min.js www/js/
          cp node_modules/js-yaml/dist/js-yaml.min.js www/js/

      - name: Prepare job data
        run: |
          mkdir -p www/data && cp data/jobs.json www/data/jobs.json
          sed -i "s#__JOBS_URL__#https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/data/jobs.json#" www/js/config.js
          sed -i "s#__BUILD__#${{ github.run_number }}#" www/js/config.js
          cat www/js/config.js

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android
          MF=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' $MF
          sed -i "s/versionCode [0-9]\+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"3.0.${{ github.run_number }}\"/" android/app/build.gradle
          echo "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" >> android/gradle.properties

      - name: Apply Job Hunter app icon
        run: |
          sudo apt-get install -y imagemagick >/dev/null
          IM=$(command -v magick || command -v convert)
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}; c=$((s/2))
            $IM resources/icon.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher.png
            $IM resources/icon.png -resize ${s}x${s} \( -size ${s}x${s} xc:none -fill white -draw "circle $c,$c $c,0" \) -compose DstIn -composite $RES/mipmap-$d/ic_launcher_round.png
            cp $RES/mipmap-$d/ic_launcher.png $RES/mipmap-$d/ic_launcher_foreground.png
          done

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign release APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            PASS="${KS_PASS:-jobhunter123}"
            ALIAS="${KS_ALIAS:-jobhunter}"
          else
            cp signing/jobhunter.jks release.jks
            PASS="jobhunter123"
            ALIAS="jobhunter"
          fi
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p 4 "$IN" aligned.apk
          $BT/apksigner sign --ks release.jks --ks-key-alias "$ALIAS" --ks-pass pass:"$PASS" --key-pass pass:"$PASS" --out JobHunter-release.apk aligned.apk
          $BT/apksigner verify JobHunter-release.apk

      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: JobHunter-Release-APK
          path: JobHunter-release.apk

      - name: Publish APK to Releases (সরাসরি রিলিজ থেকে ডাউনলোড)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest JobHunter-release.apk \
            --target "${{ github.sha }}" \
            --title "Job Hunter — Build #${{ github.run_number }}" \
            --notes "সর্বশেষ Job Hunter APK। নিচের Assets থেকে JobHunter-release.apk ডাউনলোড করে ইনস্টল করুন।"
            
